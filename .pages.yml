media:
  - name: work
    label: 案例图片
    input: public/assets/work
    output: /assets/work
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: software
    label: 软件产品图片
    input: public/assets/software
    output: /assets/software
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  - name: cases
    label: 公司案例
    type: file
    path: src/data/cases.json
    format: json
    list: true
    fields:
      - name: title
        label: 项目名称
        type: string
        required: true
      - name: slug
        label: 链接标识
        type: string
        required: true
        description: 英文、数字和短横线，例如 brand-redesign
      - name: category
        label: 类别
        type: select
        options: [文博, 公共文化, 会展, 企业, 品牌, 视觉, 数字, 空间, 软件]
        default: 文博
      - name: client
        label: 客户 / 品牌
        type: string
      - name: year
        label: 年份
        type: string
      - name: services
        label: 服务内容
        type: string
        list: true
      - name: summary
        label: 一句话介绍
        type: text
      - name: cover
        label: 封面图
        type: image
        required: true
      - name: challenge
        label: 项目背景 / 问题
        type: text
      - name: approach
        label: 我们做了什么
        type: text
      - name: result
        label: 项目结果
        type: text
      - name: gallery
        label: 项目图片
        type: image
        list: true
      - name: featured
        label: 在首页推荐
        type: boolean
        default: false
      - name: order
        label: 排序
        type: number
        default: 10
        description: 数字越小越靠前
      - name: published
        label: 发布
        type: boolean
        default: true

  - name: software
    label: 软件产品
    type: file
    path: src/data/software.json
    format: json
    list: true
    fields:
      - name: name
        label: 产品名称
        type: string
        required: true
      - name: slug
        label: 链接标识
        type: string
        required: true
        description: 英文、数字和短横线，例如 dingding
      - name: tagline
        label: 一句话标语
        type: string
      - name: summary
        label: 产品介绍
        type: text
      - name: platform
        label: 平台
        type: string
      - name: version
        label: 版本
        type: string
      - name: releaseDate
        label: 更新日期
        type: string
      - name: status
        label: 状态
        type: select
        options: [可用, 测试, 归档]
        default: 可用
      - name: cover
        label: 产品主图
        type: image
        required: true
      - name: screenshots
        label: 产品截图
        type: image
        list: true
      - name: features
        label: 功能列表
        type: object
        list: true
        fields:
          - name: title
            label: 功能名称
            type: string
          - name: body
            label: 功能说明
            type: text
      - name: proFeatures
        label: 专业版功能
        type: object
        list: true
        fields:
          - name: title
            label: 功能名称
            type: string
          - name: body
            label: 功能说明
            type: text
      - name: proNote
        label: 专业版说明
        type: text
      - name: proPrice
        label: 专业版价格
        type: string
      - name: proPriceNote
        label: 价格备注
        type: string
      - name: proShot
        label: 专业版截图
        type: image
      - name: installerUrl
        label: 安装版下载地址
        type: string
      - name: portableUrl
        label: 便携版下载地址
        type: string
      - name: readmeUrl
        label: 使用说明地址
        type: string
      - name: installerSize
        label: 安装版大小
        type: string
      - name: portableSize
        label: 便携版大小
        type: string
      - name: installerBytes
        label: 安装版字节数
        type: number
      - name: portableBytes
        label: 便携版字节数
        type: number
      - name: changelog
        label: 更新说明
        type: text
      - name: featured
        label: 在首页推荐
        type: boolean
        default: false
      - name: order
        label: 排序
        type: number
        default: 10
      - name: published
        label: 发布
        type: boolean
        default: true

  - name: site
    label: 站点设置
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: email
        label: 联系邮箱
        type: string
        required: true
      - name: address
        label: 地址
        type: string
      - name: heroLine
        label: 首页标题第一行
        type: string
      - name: heroEmphasis
        label: 首页标题强调句
        type: string
      - name: heroLead
        label: 首页介绍
        type: text
      - name: availability
        label: 当前状态
        type: string
      - name: seoTitle
        label: 默认 SEO 标题
        type: string
      - name: seoDescription
        label: 默认 SEO 描述
        type: text
